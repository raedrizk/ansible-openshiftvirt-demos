---
- name: Get current VirtualMachine {{ vm_name }} information
  redhat.openshift_virtualization.kubevirt_vm_info:
    name: "{{ vm_name }}"
    namespace: "{{ vm_namespace }}"
  register: vm_info
  delegate_to: localhost

- name: Fail if VM does not exist
  ansible.builtin.fail:
    msg: "VirtualMachine {{ vm_name }} does not exist in namespace {{ vm_namespace }}"
  when: vm_info.resources | length == 0
  delegate_to: localhost

- name: Get current VM running state
  ansible.builtin.set_fact:
    vm_running: "{{ vm_info.resources[0].spec.running | default(false) }}"
  delegate_to: localhost

- name: Stop VirtualMachine {{ vm_name }} before resizing
  kubernetes.core.k8s:
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    name: "{{ vm_name }}"
    namespace: "{{ vm_namespace }}"
    state: present
    definition:
      spec:
        running: false
  when: vm_running
  delegate_to: localhost

- name: Wait for VM to stop
  redhat.openshift_virtualization.kubevirt_vm_info:
    name: "{{ vm_name }}"
    namespace: "{{ vm_namespace }}"
  register: vm_status
  until: vm_status.resources[0].status.printableStatus | default('Stopped') == 'Stopped'
  retries: 30
  delay: 10
  when: vm_running
  delegate_to: localhost

- name: Resize VirtualMachine {{ vm_name }} using instancetype
  kubernetes.core.k8s:
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    name: "{{ vm_name }}"
    namespace: "{{ vm_namespace }}"
    state: present
    definition:
      spec:
        instancetype:
          name: "{{ vm_instance_type }}"
  when: vm_instance_type is defined and vm_instance_type != omit
  delegate_to: localhost

- name: Build resize patch JSON with unquoted integers
  ansible.builtin.set_fact:
    resize_patch_json: >-
      {
        "apiVersion": "kubevirt.io/v1",
        "kind": "VirtualMachine",
        "metadata": {
          "name": "{{ vm_name }}",
          "namespace": "{{ vm_namespace }}"
        },
        "spec": {
          "template": {
            "spec": {
              "domain": {
                "cpu": {
                  "cores": {{ vm_cores | int }},
                  "sockets": {{ vm_sockets | int }},
                  "threads": {{ vm_threads | int }}
                },
                "memory": {
                  "guest": "{{ vm_memory_size }}Gi"
                }
              }
            }
          }
        }
      }
  when:
    - vm_cores is defined and vm_cores != omit
    - vm_memory_size is defined and vm_memory_size != omit
    - vm_instance_type is not defined or vm_instance_type == omit
  delegate_to: localhost

- name: Parse JSON to dict with proper types
  ansible.builtin.set_fact:
    resize_patch_parsed: "{{ resize_patch_json | from_json }}"
  when:
    - vm_cores is defined and vm_cores != omit
    - vm_memory_size is defined and vm_memory_size != omit
    - vm_instance_type is not defined or vm_instance_type == omit
  delegate_to: localhost

- name: Resize VirtualMachine {{ vm_name }} with explicit CPU and memory
  kubernetes.core.k8s:
    state: present
    resource_definition: "{{ resize_patch_parsed }}"
  when:
    - vm_cores is defined and vm_cores != omit
    - vm_memory_size is defined and vm_memory_size != omit
    - vm_instance_type is not defined or vm_instance_type == omit
  delegate_to: localhost

- name: Start VirtualMachine {{ vm_name }} after resizing
  kubernetes.core.k8s:
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    name: "{{ vm_name }}"
    namespace: "{{ vm_namespace }}"
    state: present
    definition:
      spec:
        running: true
  when: vm_running
  delegate_to: localhost

- name: Wait for VM to start
  redhat.openshift_virtualization.kubevirt_vm_info:
    name: "{{ vm_name }}"
    namespace: "{{ vm_namespace }}"
  register: vm_status
  until: vm_status.resources[0].status.printableStatus | default('Stopped') == 'Running'
  retries: 30
  delay: 10
  when: vm_running
  delegate_to: localhost

- name: Display resize completion message
  ansible.builtin.debug:
    msg: "VirtualMachine {{ vm_name }} has been successfully resized in namespace {{ vm_namespace }}"
  delegate_to: localhost
