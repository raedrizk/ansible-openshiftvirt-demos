---
- name: Get current VirtualMachine {{ vm_name }} information
  redhat.openshift_virtualization.kubevirt_vm_info:
    name: "{{ vm_name }}"
    namespace: "{{ vm_namespace }}"
  register: vm_info
  delegate_to: localhost

- name: Fail if VM does not exist
  ansible.builtin.fail:
    msg: "VirtualMachine {{ vm_name }} does not exist in namespace {{ vm_namespace }}"
  when: vm_info.resources | length == 0
  delegate_to: localhost

- name: Get current VM running state
  ansible.builtin.set_fact:
    vm_running: "{{ vm_info.resources[0].spec.running | default(false) }}"
  delegate_to: localhost

- name: Stop VirtualMachine {{ vm_name }} before resizing
  redhat.openshift.k8s:
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    name: "{{ vm_name }}"
    namespace: "{{ vm_namespace }}"
    definition:
      spec:
        running: false
  when: vm_running
  delegate_to: localhost

- name: Wait for VM to stop
  redhat.openshift_virtualization.kubevirt_vm_info:
    name: "{{ vm_name }}"
    namespace: "{{ vm_namespace }}"
  register: vm_status
  until: vm_status.resources[0].status.printableStatus | default('Stopped') == 'Stopped'
  retries: 30
  delay: 10
  when: vm_running
  delegate_to: localhost

- name: Get full VirtualMachine {{ vm_name }} definition for instancetype update
  redhat.openshift_virtualization.kubevirt_vm_info:
    name: "{{ vm_name }}"
    namespace: "{{ vm_namespace }}"
  register: current_vm_instancetype
  when: vm_instance_type is defined and vm_instance_type != omit
  delegate_to: localhost

- name: Update VM definition with new instancetype
  ansible.builtin.set_fact:
    updated_vm_instancetype: "{{ current_vm_instancetype.resources[0] | combine(update_instancetype, recursive=True) }}"
  vars:
    update_instancetype:
      spec:
        instancetype:
          name: "{{ vm_instance_type }}"
  when: vm_instance_type is defined and vm_instance_type != omit
  delegate_to: localhost

- name: Resize VirtualMachine {{ vm_name }} using instancetype
  redhat.openshift.k8s:
    state: present
    definition: "{{ updated_vm_instancetype }}"
  when: vm_instance_type is defined and vm_instance_type != omit
  delegate_to: localhost

- name: Get full VirtualMachine {{ vm_name }} definition
  redhat.openshift_virtualization.kubevirt_vm_info:
    name: "{{ vm_name }}"
    namespace: "{{ vm_namespace }}"
  register: current_vm
  when:
    - vm_cores is defined and vm_cores != omit
    - vm_memory_size is defined and vm_memory_size != omit
    - vm_instance_type is not defined or vm_instance_type == omit
  delegate_to: localhost

- name: Build CPU spec as JSON with proper integer types
  ansible.builtin.set_fact:
    cpu_spec_json: '{"cores": {{ vm_cores | int }}, "sockets": {{ vm_sockets | int }}, "threads": {{ vm_threads | int }}}'
  when:
    - vm_cores is defined and vm_cores != omit
    - vm_memory_size is defined and vm_memory_size != omit
    - vm_instance_type is not defined or vm_instance_type == omit
  delegate_to: localhost

- name: Parse CPU spec to get proper integer types
  ansible.builtin.set_fact:
    cpu_spec_parsed: "{{ cpu_spec_json | from_json }}"
  when:
    - vm_cores is defined and vm_cores != omit
    - vm_memory_size is defined and vm_memory_size != omit
    - vm_instance_type is not defined or vm_instance_type == omit
  delegate_to: localhost

- name: Update VM definition with new CPU and memory
  ansible.builtin.set_fact:
    updated_vm: "{{ current_vm.resources[0] | combine(update_spec, recursive=True) }}"
  vars:
    update_spec:
      spec:
        template:
          spec:
            domain:
              cpu: "{{ cpu_spec_parsed }}"
              memory:
                guest: "{{ vm_memory_size }}Gi"
  when:
    - vm_cores is defined and vm_cores != omit
    - vm_memory_size is defined and vm_memory_size != omit
    - vm_instance_type is not defined or vm_instance_type == omit
  delegate_to: localhost

- name: Apply updated VirtualMachine {{ vm_name }} definition
  redhat.openshift.k8s:
    state: present
    definition: "{{ updated_vm }}"
  when:
    - vm_cores is defined and vm_cores != omit
    - vm_memory_size is defined and vm_memory_size != omit
    - vm_instance_type is not defined or vm_instance_type == omit
  delegate_to: localhost

- name: Start VirtualMachine {{ vm_name }} after resizing
  redhat.openshift.k8s:
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    name: "{{ vm_name }}"
    namespace: "{{ vm_namespace }}"
    definition:
      spec:
        running: true
  when: vm_running
  delegate_to: localhost

- name: Wait for VM to start
  redhat.openshift_virtualization.kubevirt_vm_info:
    name: "{{ vm_name }}"
    namespace: "{{ vm_namespace }}"
  register: vm_status
  until: vm_status.resources[0].status.printableStatus | default('Stopped') == 'Running'
  retries: 30
  delay: 10
  when: vm_running
  delegate_to: localhost

- name: Display resize completion message
  ansible.builtin.debug:
    msg: "VirtualMachine {{ vm_name }} has been successfully resized in namespace {{ vm_namespace }}"
  delegate_to: localhost
